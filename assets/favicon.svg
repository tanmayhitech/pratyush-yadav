    <rect x="14" y="44.5" width="13" height="3.5" rx="0.5"/>
    
    <!-- Bowl of P -->
    <path d="M23.5 16 H36 C42.5 16, 47 20, 47 26.5 C47 33, 42.5 37, 36 37 H23.5 V16 Z M29 20.5 V32.5 H35.5 C39.5 32.5, 42 30.5, 42 26.5 C42 22.5, 39.5 20.5, 35.5 20.5 H29 Z" fill-rule="evenodd"/>
